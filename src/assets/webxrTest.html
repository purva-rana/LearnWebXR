<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebXR Cube Demo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #uiOverlay {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 8px;
        z-index: 100;
      }
      #showCubeToggle {
        margin: 10px 0;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
      }
      button:hover {
        background: #45a049;
      }
      button:disabled {
        background: #666;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="uiOverlay">
      <label>
        <input type="checkbox" id="showCubeToggle" checked />
        Show Cube
      </label>
      <br />
      <button id="enterVRButton">Enter VR</button>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js";
      import { VRButton } from "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/webxr/VRButton.js";

      // Scene setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 1.6, 3);

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("renderCanvas"),
        antialias: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);

      // Create cube
      const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
      const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff88 });
      const targetCube = new THREE.Mesh(cubeGeometry, cubeMaterial);
      targetCube.position.set(0, 1.6, -2);
      scene.add(targetCube);

      // VR UI (3D text canvas)
      const createVRUI = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 256;
        const context = canvas.getContext("2d");

        const updateVRUI = (showCube) => {
          context.fillStyle = "#000000";
          context.fillRect(0, 0, canvas.width, canvas.height);

          context.fillStyle = "#ffffff";
          context.font = "bold 48px Arial";
          context.fillText("Show Cube", 50, 80);

          // Toggle switch
          context.fillStyle = showCube ? "#4CAF50" : "#666666";
          context.fillRect(50, 120, 120, 60);
          context.fillStyle = "#ffffff";
          context.fillRect(showCube ? 130 : 50, 130, 40, 40);

          context.fillStyle = "#ffffff";
          context.font = "32px Arial";
          context.fillText(showCube ? "ON" : "OFF", 200, 160);
        };

        updateVRUI(true);

        const texture = new THREE.CanvasTexture(canvas);
        const uiMaterial = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
        });
        const uiGeometry = new THREE.PlaneGeometry(2, 1);
        const uiMesh = new THREE.Mesh(uiGeometry, uiMaterial);
        uiMesh.position.set(0, 2.5, -2);
        scene.add(uiMesh);

        return { mesh: uiMesh, update: updateVRUI, texture };
      };

      const vrUI = createVRUI();

      // Controller setup with visual rays
      const controllerLeft = renderer.xr.getController(0);
      const controllerRight = renderer.xr.getController(1);

      // Create controller rays with dynamic length
      const createControllerRay = () => {
        const rayGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array([0, 0, 0, 0, 0, -5]);
        rayGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        rayGeometry.setDrawRange(0, 2);

        const rayMaterial = new THREE.LineBasicMaterial({
          color: 0xffffff,
          opacity: 0.7,
          transparent: true,
        });
        const rayLine = new THREE.Line(rayGeometry, rayMaterial);
        rayLine.userData.maxDistance = 5;
        return rayLine;
      };

      const rayLeft = createControllerRay();
      const rayRight = createControllerRay();
      controllerLeft.add(rayLeft);
      controllerRight.add(rayRight);

      scene.add(controllerLeft);
      scene.add(controllerRight);

      // Controller grips (visual representation)
      const controllerGeometry = new THREE.CylinderGeometry(
        0.02,
        0.02,
        0.15,
        16,
      );
      const controllerMaterial = new THREE.MeshStandardMaterial({
        color: 0xaaaaaa,
      });

      const controllerGripLeft = renderer.xr.getControllerGrip(0);
      const controllerMeshLeft = new THREE.Mesh(
        controllerGeometry,
        controllerMaterial.clone(),
      );
      controllerGripLeft.add(controllerMeshLeft);
      scene.add(controllerGripLeft);

      const controllerGripRight = renderer.xr.getControllerGrip(1);
      const controllerMeshRight = new THREE.Mesh(
        controllerGeometry,
        controllerMaterial.clone(),
      );
      controllerGripRight.add(controllerMeshRight);
      scene.add(controllerGripRight);

      // Raycaster for controller interaction
      const raycaster = new THREE.Raycaster();
      const tempMatrix = new THREE.Matrix4();

      // Interaction state
      let cubeGrabbedBySelect = false;
      let cubeGrabbedByGrip = false;
      let initialControllerPosition = new THREE.Vector3();
      let initialControllerQuaternion = new THREE.Quaternion();
      let initialCubePosition = new THREE.Vector3();
      let initialCubeRotation = new THREE.Euler();
      let initialControllerDistance = 0;
      let initialCubeScale = 1;
      let grabbingController = null;
      let activeControllerIndex = null;

      // Objects that can be intersected by rays
      const interactableObjects = [vrUI.mesh, targetCube];

      // Visual feedback
      const highlightCube = (isHighlighted) => {
        cubeMaterial.emissive.setHex(isHighlighted ? 0x004400 : 0x000000);
      };

      const updateRayVisuals = (ray, intersections) => {
        const positions = ray.geometry.attributes.position.array;
        const maxDistance = ray.userData.maxDistance;

        if (intersections.length > 0) {
          // Clip ray at intersection point
          const intersection = intersections[0];
          const distance = intersection.distance;

          // Update endpoint to intersection distance
          positions[3] = 0;
          positions[4] = 0;
          positions[5] = -distance;

          // Change color based on what's intersected
          ray.material.color.setHex(0x00ff00);
        } else {
          // Full length ray, no intersection
          positions[3] = 0;
          positions[4] = 0;
          positions[5] = -maxDistance;

          ray.material.color.setHex(0xffffff);
        }

        ray.geometry.attributes.position.needsUpdate = true;
      };

      // Controller events - SELECT (TRIGGER)
      const onSelectStart = (event) => {
        const controller = event.target;
        const controllerIndex = controller === controllerLeft ? 0 : 1;

        tempMatrix.identity().extractRotation(controller.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersections = raycaster.intersectObjects(
          interactableObjects,
          false,
        );

        if (intersections.length > 0) {
          const firstIntersection = intersections[0];

          // Check if it's the UI
          if (firstIntersection.object === vrUI.mesh) {
            targetCube.visible = !targetCube.visible;
            vrUI.update(targetCube.visible);
            vrUI.texture.needsUpdate = true;

            // Visual feedback
            const ray = controllerIndex === 0 ? rayLeft : rayRight;
            ray.material.color.setHex(0xff00ff);
            setTimeout(() => updateRayVisuals(ray, intersections), 200);
            return;
          }

          // Check if it's the cube
          if (firstIntersection.object === targetCube && targetCube.visible) {
            cubeGrabbedBySelect = true;
            grabbingController = controller;
            activeControllerIndex = controllerIndex;

            initialControllerPosition.setFromMatrixPosition(
              controller.matrixWorld,
            );
            initialControllerQuaternion.setFromRotationMatrix(
              controller.matrixWorld,
            );
            initialCubePosition.copy(targetCube.position);
            initialCubeRotation.copy(targetCube.rotation);

            highlightCube(true);
            cubeMaterial.color.setHex(0x00ffff);
          }
        }
      };

      const onSelectEnd = (event) => {
        if (grabbingController === event.target && cubeGrabbedBySelect) {
          cubeGrabbedBySelect = false;
          grabbingController = null;
          activeControllerIndex = null;
          highlightCube(false);
          cubeMaterial.color.setHex(0x00ff88);
        }
      };

      // Controller events - SQUEEZE (GRIP)
      const onSqueezeStart = (event) => {
        const controller = event.target;
        const controllerIndex = controller === controllerLeft ? 0 : 1;

        tempMatrix.identity().extractRotation(controller.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersections = raycaster.intersectObjects(
          interactableObjects,
          false,
        );

        if (
          intersections.length > 0 &&
          intersections[0].object === targetCube &&
          targetCube.visible
        ) {
          cubeGrabbedByGrip = true;
          grabbingController = controller;
          activeControllerIndex = controllerIndex;

          initialControllerPosition.setFromMatrixPosition(
            controller.matrixWorld,
          );
          initialControllerDistance = initialControllerPosition.distanceTo(
            targetCube.position,
          );
          initialCubeScale = targetCube.scale.x;

          highlightCube(true);
          cubeMaterial.color.setHex(0xffff00);

          // Visual feedback on controller
          const mesh =
            controllerIndex === 0 ? controllerMeshLeft : controllerMeshRight;
          mesh.material.color.setHex(0xffff00);
        }
      };

      const onSqueezeEnd = (event) => {
        const controllerIndex = event.target === controllerLeft ? 0 : 1;

        if (grabbingController === event.target && cubeGrabbedByGrip) {
          cubeGrabbedByGrip = false;
          grabbingController = null;
          activeControllerIndex = null;
          highlightCube(false);
          cubeMaterial.color.setHex(0x00ff88);

          const mesh =
            controllerIndex === 0 ? controllerMeshLeft : controllerMeshRight;
          mesh.material.color.setHex(0xaaaaaa);
        }
      };

      // Add event listeners
      controllerLeft.addEventListener("selectstart", onSelectStart);
      controllerLeft.addEventListener("selectend", onSelectEnd);
      controllerLeft.addEventListener("squeezestart", onSqueezeStart);
      controllerLeft.addEventListener("squeezeend", onSqueezeEnd);

      controllerRight.addEventListener("selectstart", onSelectStart);
      controllerRight.addEventListener("selectend", onSelectEnd);
      controllerRight.addEventListener("squeezestart", onSqueezeStart);
      controllerRight.addEventListener("squeezeend", onSqueezeEnd);

      // UI controls
      const showCubeToggle = document.getElementById("showCubeToggle");
      showCubeToggle.addEventListener("change", (e) => {
        targetCube.visible = e.target.checked;
        vrUI.update(targetCube.visible);
        vrUI.texture.needsUpdate = true;
      });

      const enterVRButton = document.getElementById("enterVRButton");
      enterVRButton.addEventListener("click", () => {
        if (renderer.xr.isPresenting) {
          renderer.xr.getSession().end();
        } else {
          navigator.xr
            .requestSession("immersive-vr", {
              requiredFeatures: ["local-floor"],
            })
            .then((session) => {
              renderer.xr.setSession(session);
            });
        }
      });

      // Check VR support
      if ("xr" in navigator) {
        navigator.xr.isSessionSupported("immersive-vr").then((supported) => {
          enterVRButton.disabled = !supported;
          if (!supported) {
            enterVRButton.textContent = "VR Not Supported";
          }
        });
      } else {
        enterVRButton.disabled = true;
        enterVRButton.textContent = "WebXR Not Available";
      }

      // Handle window resize
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Animation loop
      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render() {
        // Update raycaster intersection and ray visuals
        if (renderer.xr.isPresenting) {
          [controllerLeft, controllerRight].forEach((controller, index) => {
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const ray = index === 0 ? rayLeft : rayRight;

            // Get all intersections sorted by distance
            const intersections = raycaster.intersectObjects(
              interactableObjects,
              false,
            );

            // Update ray visuals with clipping
            updateRayVisuals(ray, intersections);
          });
        }

        // Handle cube manipulation - SELECT (move + rotate)
        if (cubeGrabbedBySelect && grabbingController) {
          const currentControllerPosition = new THREE.Vector3();
          currentControllerPosition.setFromMatrixPosition(
            grabbingController.matrixWorld,
          );

          const positionDelta = currentControllerPosition
            .clone()
            .sub(initialControllerPosition);
          targetCube.position.copy(initialCubePosition).add(positionDelta);

          // Rotate cube based on controller rotation
          const currentControllerQuaternion = new THREE.Quaternion();
          currentControllerQuaternion.setFromRotationMatrix(
            grabbingController.matrixWorld,
          );

          const rotationDelta = new THREE.Quaternion();
          rotationDelta
            .copy(currentControllerQuaternion)
            .multiply(initialControllerQuaternion.clone().invert());

          const rotationEuler = new THREE.Euler().setFromQuaternion(
            rotationDelta,
          );
          targetCube.rotation.set(
            initialCubeRotation.x + rotationEuler.x,
            initialCubeRotation.y + rotationEuler.y,
            initialCubeRotation.z + rotationEuler.z,
          );
        }

        // Handle zoom - SQUEEZE (scale)
        if (cubeGrabbedByGrip && grabbingController) {
          const currentControllerPosition = new THREE.Vector3();
          currentControllerPosition.setFromMatrixPosition(
            grabbingController.matrixWorld,
          );
          const currentDistance = currentControllerPosition.distanceTo(
            targetCube.position,
          );
          const scaleFactor = currentDistance / initialControllerDistance;
          const newScale = Math.max(
            0.3,
            Math.min(3, initialCubeScale * scaleFactor),
          );
          targetCube.scale.setScalar(newScale);
        }

        // Gentle cube rotation in inline mode
        if (!renderer.xr.isPresenting) {
          targetCube.rotation.y += 0.01;
        }

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
